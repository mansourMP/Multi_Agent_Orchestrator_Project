name: Build Desktop

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          npm ci --prefix frontend

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Python backend binary
        run: pyinstaller --onefile --distpath pyinstaller-dist --workpath pyinstaller-build --name empyralis-backend server.py

      - name: Copy backend binary to dist/
        run: |
          mkdir -p dist
          cp pyinstaller-dist/empyralis-backend dist/empyralis-backend
          chmod +x dist/empyralis-backend

      - name: Build Next.js frontend
        run: npm run build --prefix frontend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cd src-tauri && cargo tauri build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: empyralis-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          npm install
          npm ci --prefix frontend

      - name: Install PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Python backend binary
        shell: bash
        run: pyinstaller --onefile --distpath pyinstaller-dist --workpath pyinstaller-build --name empyralis-backend server.py

      - name: Copy backend binary to dist/
        shell: bash
        run: |
          mkdir -p dist
          cp pyinstaller-dist/empyralis-backend.exe dist/empyralis-backend.exe

      - name: Build Next.js frontend
        shell: bash
        run: npm run build --prefix frontend

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        shell: bash
        run: cd src-tauri && cargo tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: empyralis-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          npm ci --prefix frontend

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Python backend binary
        run: pyinstaller --onefile --distpath pyinstaller-dist --workpath pyinstaller-build --name empyralis-backend server.py

      - name: Copy backend binary to dist/
        run: |
          mkdir -p dist
          cp pyinstaller-dist/empyralis-backend dist/empyralis-backend
          chmod +x dist/empyralis-backend

      - name: Build Next.js frontend
        run: npm run build --prefix frontend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cd src-tauri && cargo tauri build

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: empyralis-linux
          path: src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
