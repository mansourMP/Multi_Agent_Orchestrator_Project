name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-worker.txt pytest

      - name: Run server test suite
        run: python -m pytest server_modules/tests

  shell-typecheck:
    name: Frontend and mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Typecheck frontend
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: frontend

      - name: Typecheck mobile
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: mobile

  supervisor-build:
    name: Rust supervisor build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build empyralis-supervisor
        run: cargo build --manifest-path empyralis-supervisor/Cargo.toml
