[package]
name = "empyralis-tray"
version = "0.1.0"
description = "Empyralis menu bar hardware connector"
authors = ["Empyralis"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
hmac = "0.12"
sha2 = "0.10"
