version: "3.8"

services:
  unsupported:
    image: alpine:3.20
    command:
      - /bin/sh
      - -lc
      - |
        echo "docker-compose.yml is deprecated and unsupported for Empyralis."
        echo "Use render.yaml for the supported cloud target."
        echo "Use scripts/run_orion_desktop.sh from a built repo checkout for the supported desktop target."
        exit 1
    restart: "no"
