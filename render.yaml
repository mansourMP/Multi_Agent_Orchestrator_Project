databases:
  - name: empyralis-postgres
    plan: starter

services:
  - type: web
    name: empyralis-runtime
    runtime: docker
    dockerfilePath: ./Dockerfile.runtime
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: empyralis-state
      mountPath: /var/data/empyralis
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8001"
      - key: ORION_RUNTIME_HOST
        value: "0.0.0.0"
      - key: ORION_ENV
        value: production
      - key: ORION_AUTH_REQUIRED
        value: "1"
      - key: ORION_REQUIRE_DURABLE_RUN_STATE
        value: "1"
      - key: ORION_LOG_FORMAT
        value: json
      - key: ORION_PUBLIC_REGISTRATION_ENABLED
        value: "1"
      - key: EMPYRALIS_STATE_HOME
        value: /var/data/empyralis/state
      - key: DATABASE_URL
        fromDatabase:
          name: empyralis-postgres
          property: connectionString
      - key: ORION_API_KEY
        generateValue: true
      - key: ORION_JWT_SECRET
        generateValue: true
      - key: EMPYRALIS_SECRETS_BROKER_SECRET
        generateValue: true
      - key: EMPYRALIS_TOOL_BROKER_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://empyralis-web.onrender.com
      - key: CONTROL_PLANE_ORIGINS
        value: https://empyralis-web.onrender.com
      - key: ORION_TELEGRAM_AUTOPILOT_ENABLED
        value: "1"
      - key: ORION_TELEGRAM_AUTOPILOT_DELIVERY_MODE
        value: webhook
      - key: ORION_TELEGRAM_AUTOPILOT_WEBHOOK_SECRET
        generateValue: true
      - key: ORION_TELEGRAM_AUTOPILOT_PUBLIC_BASE_URL
        value: https://empyralis-runtime.onrender.com
      - key: ORION_WHATSAPP_AUTOPILOT_PUBLIC_BASE_URL
        value: https://empyralis-runtime.onrender.com
  - type: web
    name: empyralis-web
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        value: https://empyralis-runtime.onrender.com
      - key: NEXT_PUBLIC_ORION_API_URL
        value: https://empyralis-runtime.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://empyralis-runtime.onrender.com
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
