{
  "enabled": true,
  "monitoring": {
    "interval_seconds": 60,
    "summary_refresh_minutes": 15,
    "default_space_id": "pool",
    "timezone": "local"
  },
  "storage": {
    "spaces_root": "spaces",
    "snapshots_root": "spaces/_snapshots"
  },
  "detector": {
    "enabled": false,
    "model_id": "PekingU/rtdetr_v2_r18vd",
    "threshold": 0.35,
    "person_label": "person"
  },
  "vlm": {
    "preference": "cloud",
    "model_provider": "openai",
    "allow_structured_fallback": true,
    "ollama": {
      "endpoint": "http://127.0.0.1:11434",
      "model": "qwen2.5vl:7b"
    },
    "cloud": {
      "provider_order": ["openai", "anthropic", "gemini"],
      "openai_model": "gpt-4o",
      "anthropic_model": "claude-sonnet-4-20250514",
      "gemini_model": "gemini-1.5-pro"
    }
  },
  "spaces": [
    {
      "id": "pool",
      "name": "Hotel Pool",
      "aliases": ["pool", "swimming pool"],
      "business_hours": {"mon-sun": "07:00-22:00"},
      "busy_threshold": 15,
      "telegram_recipients": [],
      "cameras": [
        {
          "id": "cam-01",
          "input": {
            "type": "file",
            "path": "Screenshot 2026-03-20 at 21.14.39.png"
          }
        }
      ]
    }
  ]
}
